version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hyperlocal_food_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_delivery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d food_delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
